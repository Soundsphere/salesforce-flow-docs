services:
  automation-docs:
    build:
      context: ..
      dockerfile: automation-docs/Dockerfile
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command:
      - --project-root
      - /workspace
      - --output-dir
      - docs/automation/evidence

  tests:
    build:
      context: ..
      dockerfile: automation-docs/Dockerfile
    working_dir: /workspace
    volumes:
      - ..:/workspace
    entrypoint:
      - python
    command:
      - -m
      - unittest
      - discover
      - -s
      - automation-docs/tests
